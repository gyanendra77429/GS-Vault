<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GS Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>
        
        <div class="upload-section">
            <input type="file" id="fileInput">
            <button onclick="uploadFile()">Upload File</button>
        </div>

        <hr>

        <h3>Manage Uploaded Files</h3>
        <div id="admin-file-list">
            <p>Loading files...</p>
        </div>

        <hr>
        
        <button onclick="logout()" class="logout-btn">Logout & Back to Home</button>
    </div>

    <script type="module" src="admin-logic.js"></script>
</body>
</html>
