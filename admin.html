<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - GS Vault</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 800px; margin: auto; padding: 20px; font-family: sans-serif; }
        .upload-card { background: #222; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #444; }
        .link-card { border-color: #007bff; }
        .file-list-item { background: #1a1a1a; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border: 1px solid #333; }
        input { width: 95%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #444; background: #000; color: white; }
        .btn { padding: 10px 15px; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; }
        .btn-upload { background: #28a745; color: white; }
        .btn-link { background: #007bff; color: white; }
        .btn-logout { background: #555; color: white; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>
        
        <div class="upload-card">
            <h3>📂 Upload File (PDF/Image)</h3>
            <input type="file" id="fileInput">
            <button onclick="uploadFile()" class="btn btn-upload">Upload to Storage</button>
        </div>

        <div class="upload-card link-card">
            <h3>🔗 Save Important Link/URL</h3>
            <input type="text" id="linkTitle" placeholder="Link ka naam (e.g. My Drive)">
            <input type="text" id="linkURL" placeholder="Paste URL here (https://...)">
            <button onclick="addLink()" class="btn btn-link">Save Link to Database</button>
        </div>

        <hr style="border: 0.5px solid #333; margin: 30px 0;">

        <h3>📝 Manage Files & Links</h3>
        <div id="admin-file-list"></div>
        <div id="admin-links-list"></div>

        <button onclick="logout()" class="btn btn-logout">Logout</button>
    </div>

    <script type="module" src="admin-logic.js"></script>
</body>
</html>
